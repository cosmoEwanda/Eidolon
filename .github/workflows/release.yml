name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Patch PyInstaller suppressed imports
        run: |
          python scripts/patch_suppressed.py

      - name: Build with PyInstaller (using .spec)
        run: |
          pyinstaller --noconfirm --clean --log-level DEBUG Eidolon.spec

      - name: Upload EXE to Release (solo su tag)
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with: 
          files: dist/Eidolon.exe
